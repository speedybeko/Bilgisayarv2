name: Build TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP and Prepare Project
        run: |
          if [ -f "oyun-ceviri-5.zip" ]; then
            unzip -o oyun-ceviri-5.zip
            cp -r oyun-ceviri/* .
            cp -r oyun-ceviri/.* . 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build TV Debug APK
        run: gradle :tv:assembleDebug

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-debug-apk
          path: tv/build/outputs/apk/debug/*.apk
